name: Daily Rebuild & Integrity Check

# 매일 하는 일은 "데이터 수집"이 아니라 "재현·검증·재빌드"다.
#   - 파이프라인을 처음부터 다시 돌려 재현성이 깨졌는지 확인
#   - 무결성 검증으로 원칙 위반 탐지
#   - 날짜 의존 지표(조사 노후도, D-day) 갱신
#
# 새 데이터 적재는 manual_update 워크플로에서 PR 로만 들어온다.
# 모델이 만든 데이터를 사람 검토 없이 main 에 넣지 않는다.

on:
  schedule:
    - cron: '0 0 * * *'      # UTC 00:00 = KST 09:00
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tracker-daily
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 의존성 설치
        run: pip install --quiet pillow

      - name: 파이프라인 클린 재현
        run: ./scripts/run_pipeline.sh

      - name: 무결성 검증
        id: validate
        run: python3 scripts/99_validate.py

      - name: 노후 데이터 점검
        run: |
          python3 - <<'PY'
          import sqlite3, math, datetime
          con = sqlite3.connect("data/tracker.db")
          con.create_function("log",1,lambda x: math.log(x) if x and x>0 else None)
          stale = con.execute("""SELECT state_code, office, poll_age_days
              FROM v_poll_coverage WHERE coverage_status='STALE'""").fetchall()
          gap = con.execute("""SELECT COUNT(*) FROM v_poll_coverage
              WHERE coverage_status='NO_POLLING'""").fetchone()[0]
          last = con.execute("SELECT MAX(changed_at) FROM change_log").fetchone()[0]
          days = (datetime.date.today() - datetime.date.fromisoformat(last)).days
          print(f"마지막 데이터 변동: {last} ({days}일 전)")
          print(f"여론조사 공백: {gap}개 레이스 · 노후: {len(stale)}건")
          if days > 7:
              print(f"::warning::{days}일간 새 데이터가 없습니다. 수동 갱신이 필요합니다.")
          PY

      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: daily rebuild $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: 실패 시 이슈 생성
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `일일 빌드 실패 — ${new Date().toISOString().slice(0,10)}`,
              body: `파이프라인 재현 또는 무결성 검증이 실패했습니다.\n\n[실행 로그](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['build-failure']
            });
