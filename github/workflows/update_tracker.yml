name: Update Tracker via Gemini

on:
  workflow_dispatch:
    inputs:
      poll_data:
        description: '새로운 여론조사 결과 또는 기사 텍스트를 입력하세요'
        required: true
        type: string

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install google-genai pillow

      - name: Gemini API로 갱신 스크립트 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/auto_update_poll.py "${{ github.event.inputs.poll_data }}"

      - name: 파이프라인 클린 빌드 및 전체 재검증
        run: |
          rm -f data/tracker.db
          for f in scripts/0*.py scripts/1*.py; do
            echo "실행 중: $f"
            python3 "$f" || exit 1
          done

      - name: 변경사항 Git Commit 및 Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update tracker via Gemini Actions [skip ci]" && git push)
